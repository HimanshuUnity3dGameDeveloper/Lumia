<ion-header [translucent]="true">
  <ion-toolbar>
    <div class="header">
      <ion-button class="icon-class" shape="round" size="small" fill="clear" >
        <ion-icon name="add-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button class="toggleAccount" shape="round" fill="clear" >
        <span>{{user?.username}}</span>
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </ion-button>
      <ion-button class="icon-class" shape="round" size="small" fill="clear">
        <ion-icon name="menu-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Pull to Refresh Component -->
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content 
      pullingIcon="chevron-down-circle-outline" 
      pullingText="Pull down to refresh" 
      refreshingSpinner="circles" 
      refreshingText="Fetching profile...">
    </ion-refresher-content>
  </ion-refresher>
  <div class="container">
    <div class="profileDetails">
      <div class="profile-avatar">
        <ion-avatar>
          <ion-img [src]="getUserAvatar()" alt="User"></ion-img>
        </ion-avatar>
      </div>
      <div class="profile-content">
        <p>{{user?.fullname}}</p>
        <div class="follow-list">
          <div class="list">
            <p>{{user?.postNumber}}</p>
            <p>posts</p>
          </div>
          <div class="list">
            <p>{{user?.followerNumber}}</p>
            <p>followers</p>
          </div>
          <div class="list">
            <p>{{user?.followingNumber}}</p>
            <p>following</p>
          </div>
        </div>
      </div>
    </div>

    <div class="profileBio">
      <ion-button (click)="updatePost()">
        Update Post
      </ion-button>
      
      <ion-button (click)="updateFollower()">
        Update Follower
      </ion-button>
      
      <ion-button (click)="followingBtn()">
        Update Following
      </ion-button>
    </div>
  </div>
  <ion-tabs>
    <ion-tab-bar>
      <ion-tab-button>
          <ion-icon name="home-outline"></ion-icon>
      </ion-tab-button>
      <ion-tab-button>
          <ion-icon name="musical-notes-outline"></ion-icon>
      </ion-tab-button>
      <ion-tab-button>
          <ion-icon name="paper-plane-outline"></ion-icon>
      </ion-tab-button>
      <ion-tab-button>
          <ion-icon name="search-outline"></ion-icon>
      </ion-tab-button>
      <ion-tab-button>
          <ion-avatar class="person">
            <ion-img [src]="getUserAvatar()" alt="User Avatar"></ion-img>
          </ion-avatar>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-content>
