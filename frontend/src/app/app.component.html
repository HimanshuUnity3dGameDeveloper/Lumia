<ion-app>
  <ion-content></ion-content>
  <ion-router-outlet></ion-router-outlet>
  <ion-footer class="custom-footer" *ngIf="showTabs">
    <ion-toolbar>
      <div class="footer-button-container">
        <ion-tab-bar mode="md" slot="bottom">
          <ion-tab-button (click)="onChangeMode('home')" [class.tab-selected]="activeTab === 'home'">
              <ion-icon [name]="activeTab === 'home' ? 'home' : 'home-outline'"></ion-icon>
          </ion-tab-button>
          <ion-tab-button (click)="onChangeMode('reels')" [class.tab-selected]="activeTab === 'reels'">
              <ion-icon [name]="activeTab === 'reels' ? 'play' : 'play-outline'"></ion-icon>
          </ion-tab-button>
          <ion-tab-button (click)="onChangeMode('chat')" [class.tab-selected]="activeTab === 'chat'">
              <ion-icon [name]="activeTab === 'chat' ? 'paper-plane' : 'paper-plane-outline'"></ion-icon>
          </ion-tab-button>
          <ion-tab-button (click)="onChangeMode('search')" [class.tab-selected]="activeTab === 'search'">
              <ion-icon [name]="activeTab === 'search' ? 'search' : 'search-outline'"></ion-icon>
          </ion-tab-button>
          <ion-tab-button (click)="onChangeMode('profile')" [class.tab-selected]="activeTab === 'profile'">
              <ion-avatar class="person">
                <ion-img [src]="getUserAvatar()" alt="User Avatar"></ion-img>
              </ion-avatar>
          </ion-tab-button>
        </ion-tab-bar>
      </div>
    </ion-toolbar>
  </ion-footer>
</ion-app>
